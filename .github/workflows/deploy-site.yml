name: Deploy docs site

# Builds the library, then the Astro/Starlight site, and publishes site/dist to
# GitHub Pages. One-time setup (repo → Settings → Pages): set Source to
# "GitHub Actions" and the custom domain to ui.sakhalabs.com.
#
# Local equivalent of the build steps:
#   npm ci && npm run build:ui
#   npm install --prefix site && npm run build:site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a run still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      # The site imports the library's built CSS, so the library must be built
      # first (dist/ is gitignored and is not in the repo).
      - name: Install the workspace and build the library
        run: |
          npm ci
          npm run build:ui

      # `npm install`, not `npm ci`: the site lockfile is generated on Windows,
      # and `npm ci` refuses a lockfile that lacks the platform-specific
      # optional dependencies that Linux resolves (e.g. "@emnapi/core ... Missing
      # from lock file"). npm install resolves those extras on the runner.
      #
      # Public-repo job logs need a GitHub sign-in to read, so on failure the npm
      # error is re-emitted as a check-run annotation, which is readable without
      # auth (run → Annotations tab, or the REST API).
      - name: Install the site
        working-directory: site
        run: |
          set -o pipefail
          if npm install --no-audit --no-fund 2>&1 | tee /tmp/site-install.log; then
            exit 0
          fi
          MSG=$(head -25 /tmp/site-install.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=npm install (site) failed::$MSG"
          exit 1

      - name: Build the site
        working-directory: site
        run: npm run build

      # Requires Pages to be enabled once in repo settings (Settings → Pages →
      # Source = "GitHub Actions"); the workflow token cannot enable it for you.
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
